server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Healthcheck del contenedor (no pasa por PHP)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Estáticos si existen; si no, al front controller de Laravel
    location / {
        try_files $uri /index.php?$query_string;
    }

    # ÚNICO punto de entrada PHP: index.php. Cualquier otro .php devuelve 404.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    # Archivos ocultos (.env, .git, .htaccess...)
    location ~ /\. {
        deny all;
    }
}
