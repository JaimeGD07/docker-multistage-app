# Ecosistema: Next.js (frontend) + Laravel/PHP-FPM + Nginx (backend) + MySQL.
# Fase 4: base de datos + backend (PHP-FPM + Nginx) + frontend (Next.js).

services:
  db:
    image: mysql:8.0
    container_name: ecommerce_db
    restart: unless-stopped
    # utf8mb4 como juego de caracteres por defecto del servidor
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
    # 3306 solo es visible dentro de la red de Docker: NO se publica al host.
    expose:
      - "3306"
    volumes:
      # Datos persistentes: sobreviven a `docker compose down` (sin -v)
      - db_data:/var/lib/mysql
      # Scripts SQL opcionales; se ejecutan solo en el primer arranque (volumen vacío)
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend_net

  # --- Backend Laravel: PHP-FPM (solo accesible desde Nginx, puerto 9000 interno) ---
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ecommerce-api:latest
    container_name: ecommerce_app
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-E-commerce API}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env}
      APP_URL: ${APP_URL:-http://localhost:8030}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      STRIPE_SECRET: ${STRIPE_SECRET:?Define STRIPE_SECRET en .env}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      L5_SWAGGER_GENERATE_ALWAYS: "false"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - backend_net

  # --- Nginx: único punto de entrada HTTP de la API ---
  nginx:
    build:
      context: ./backend
      dockerfile: nginx/Dockerfile
    image: ecommerce-nginx:latest
    container_name: ecommerce_nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8030}:8080"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend_net

  # --- Frontend Next.js (servidor standalone) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Clave PÚBLICA de Stripe: se incrusta en el JS del navegador en el build
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:?Define NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY en .env}
    image: ecommerce-frontend:latest
    container_name: ecommerce_frontend
    restart: unless-stopped
    environment:
      # El servidor de Next llama a la API por la red interna de Docker (a través de Nginx)
      API_BASE_URL: http://nginx:8080/api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - backend_net

volumes:
  db_data:

networks:
  backend_net:
    driver: bridge
